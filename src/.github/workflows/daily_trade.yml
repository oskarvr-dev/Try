name: Congress Trader – Täglicher Lauf

on:
  schedule:
    # Jeden Wochentag um 15:35 UTC = 09:35 EST (5 Min nach Marktöffnung)
    - cron: "35 14 * * 1-5"
  workflow_dispatch:  # Manuell auslösbar über GitHub UI

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Congress Trader ausführen
        env:
          ALPACA_KEY:     ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET:  ${{ secrets.ALPACA_SECRET }}
          EMAIL_ADDRESS:  ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_ADDRESS }}
        run: python src/main.py
